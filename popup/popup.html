<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IG Cinema View</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24">
        <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v12h16V6H4zm6 2.5l6 3.5-6 3.5v-7z"/>
      </svg>
    </div>
    <div class="title-group">
      <span class="title">IG Cinema View</span>
      <span class="version">Version 1.2.1</span>
    </div>
  </div>

  <div class="card">
    <div class="card-info">
      <span class="card-label">Cinema Mode</span>
      <div class="status-indicator">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Active on Feed</span>
      </div>
    </div>
    <label class="switch">
      <input type="checkbox" id="cinemaToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="shortcut-row">
    <div class="shortcut-info">
      <span class="shortcut-label">Toggle Shortcut</span>
      <span class="shortcut-sub" id="osLabel">macOS / Windows</span>
    </div>
    <div class="keys" id="shortcutBadge">
      <kbd id="modKey">Alt</kbd>
      <span class="key-plus">+</span>
      <kbd>C</kbd>
    </div>
  </div>

  <div class="features">
    <div class="feature-item">
      <svg class="feature-icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      <span>Home feed only. Reels and Stories remain native.</span>
    </div>
    <div class="feature-item">
      <svg class="feature-icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      <span>Adaptive viewport fit for widescreen media.</span>
    </div>
    <div class="feature-item">
      <svg class="feature-icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      <span>High resolution stream optimization.</span>
    </div>
  </div>

  <div class="footer">
    instagram.com home feed experience
  </div>

  <script src="popup.js"></script>
</body>
</html>
