<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IG Cinema View</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24">
        <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v12h16V6H4zm6 2.5l6 3.5-6 3.5v-7z"/>
      </svg>
    </div>
    <div class="title-group">
      <span class="title">IG Cinema View</span>
      <span class="version">v1.2.1</span>
    </div>
  </div>

  <div class="card">
    <div class="card-info">
      <span class="card-label">Cinema Mode</span>
      <div class="status-indicator">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Active</span>
      </div>
    </div>
    <label class="switch">
      <input type="checkbox" id="cinemaToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="shortcut-row">
    <div class="shortcut-info">
      <span class="shortcut-label">Toggle Shortcut</span>
      <span class="shortcut-sub" id="osLabel">macOS / Windows</span>
    </div>
    <div class="keys" id="shortcutBadge">
      <kbd id="modKey">Option</kbd>
      <span class="key-plus">+</span>
      <kbd>C</kbd>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
